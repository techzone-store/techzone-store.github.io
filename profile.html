<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>

<body class="bg-gray-950 text-white min-h-screen overflow-x-hidden">

<!-- AUTH CHECK -->
<script>
if(localStorage.getItem("isLoggedIn") !== "true"){
    window.location.href = "login.html";
}
</script>

<!-- NAV -->
<nav class="bg-black/40 backdrop-blur-lg border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold text-cyan-400">TechZone Profile</h1>

        <div class="flex gap-3">
            <a href="dashboard.html" class="bg-gray-900 px-4 py-2 rounded-xl hover:bg-gray-800">Dashboard</a>
            <a href="cart.html" class="bg-gray-900 px-4 py-2 rounded-xl hover:bg-gray-800">Cart</a>
            <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-xl font-semibold hover:bg-red-400">
                Logout
            </button>
        </div>

    </div>
</nav>

<!-- GLOW -->
<div class="absolute top-0 left-0 w-96 h-96 bg-cyan-500/20 blur-3xl rounded-full"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-500/20 blur-3xl rounded-full"></div>

<!-- CONTENT -->
<div class="relative max-w-5xl mx-auto p-6">

    <h1 class="text-4xl font-bold text-cyan-400 mb-8">My Profile 👤</h1>

    <!-- PROFILE CARD -->
    <div class="bg-black/40 border border-gray-800 rounded-3xl p-8 mb-8">

        <div class="flex items-center gap-6">

            <img src="https://i.pravatar.cc/150"
                class="w-24 h-24 rounded-full border-2 border-cyan-400">

            <div>
                <h2 id="displayName" class="text-2xl font-bold">User</h2>
                <p id="displayEmail" class="text-gray-400">email@example.com</p>
            </div>

        </div>

    </div>

    <!-- EDIT FORM -->
    <div class="bg-black/40 border border-gray-800 rounded-3xl p-8">

        <h2 class="text-2xl font-bold mb-6">Edit Profile</h2>

        <form id="profileForm" class="space-y-5">

            <div>
                <label class="text-gray-300">Full Name</label>
                <input id="name" type="text"
                    class="w-full mt-2 bg-gray-900 border border-gray-700 px-4 py-3 rounded-xl focus:border-cyan-400 outline-none">
            </div>

            <div>
                <label class="text-gray-300">Email</label>
                <input id="email" type="email"
                    class="w-full mt-2 bg-gray-900 border border-gray-700 px-4 py-3 rounded-xl focus:border-cyan-400 outline-none">
            </div>

            <div>
                <label class="text-gray-300">New Password</label>
                <input id="password" type="password"
                    class="w-full mt-2 bg-gray-900 border border-gray-700 px-4 py-3 rounded-xl focus:border-cyan-400 outline-none"
                    placeholder="Leave blank to keep old password">
            </div>

            <button type="submit"
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-4 rounded-xl">
                Save Changes
            </button>

        </form>

    </div>

</div>

<script>

/* ======================
   LOGOUT
====================== */
function logout(){
    localStorage.removeItem("isLoggedIn");
    window.location.href = "login.html";
}

/* ======================
   LOAD USER
====================== */
let user = JSON.parse(localStorage.getItem("user"));

if(!user){
    alert("No user found");
    window.location.href = "signup.html";
}

function loadUser(){
    document.getElementById("displayName").innerText = user.name;
    document.getElementById("displayEmail").innerText = user.email;

    document.getElementById("name").value = user.name;
    document.getElementById("email").value = user.email;
}

loadUser();

/* ======================
   UPDATE PROFILE
====================== */
document.getElementById("profileForm").addEventListener("submit", function(e){
    e.preventDefault();

    const newName = document.getElementById("name").value;
    const newEmail = document.getElementById("email").value;
    const newPassword = document.getElementById("password").value;

    user.name = newName;
    user.email = newEmail;

    if(newPassword.trim() !== ""){
        user.password = newPassword;
    }

    localStorage.setItem("user", JSON.stringify(user));

    alert("Profile Updated Successfully ✅");

    loadUser();
});

</script>

</body>
</html>
